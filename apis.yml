description: >-
  Unframe AI is an enterprise AI platform (Unframe AI OS) that assembles
  production-ready AI solutions from modular building blocks — an Agent
  Orchestrator, Knowledge Fabric, AI-native Data Store, and Voice Agents — so
  companies can deploy agentic AI across unstructured data, cross-system
  workflows, and legacy systems without rebuilding core software. Deployments
  run in cloud, private VPC, or fully on-premises, are model-agnostic, and are
  governed with RBAC, SSO, lineage tracking, and audit logs. Founded by Shay
  Levi, Larissa Schneider, and Adi Azarya, with offices in Cupertino, Tel Aviv,
  and Berlin; backed by Bessemer Venture Partners and others; acquired Swish
  AI. Sales-led platform with no public developer API surface today.
